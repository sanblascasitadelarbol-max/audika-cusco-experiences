name: Publicar Audika y sincronizar calendarios Airbnb
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sincronizar calendarios
        env:
          AUDIKA_ICAL_FEEDS_JSON: ${{ secrets.AUDIKA_ICAL_FEEDS_JSON }}
        run: python SOLO_ADMIN/actualizar_calendarios.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_publica
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
